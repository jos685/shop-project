<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- POS terminal body -->
  <rect x="52" y="44" width="88" height="68" rx="10" fill="rgba(255,255,255,0.12)"/>
  <rect x="60" y="52" width="72" height="44" rx="6" fill="rgba(255,255,255,0.18)"/>
  <!-- Screen lines -->
  <rect x="68" y="62" width="40" height="5" rx="2.5" fill="url(#ag)"/>
  <rect x="68" y="72" width="56" height="5" rx="2.5" fill="rgba(255,255,255,0.4)"/>
  <rect x="68" y="82" width="48" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
  <!-- Keypad -->
  <rect x="60" y="118" width="72" height="28" rx="6" fill="rgba(255,255,255,0.1)"/>
  <circle cx="80" cy="132" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="96" cy="132" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="112" cy="132" r="5" fill="rgba(255,255,255,0.3)"/>
  <!-- Receipt strip -->
  <rect x="82" y="112" width="28" height="10" rx="3" fill="rgba(255,255,255,0.25)"/>
  <!-- QASHUP text -->
  <text x="96" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5">
    <tspan fill="#c084fc">QASH</tspan><tspan fill="#e879f9">UP</tspan>
  </text>
</svg>
